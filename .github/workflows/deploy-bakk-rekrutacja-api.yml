name: Deploy etap2 API → bakk-rekrutacja-api (Function App)

# Buduje TS i wdraża Azure Functions z `etap2/api/` na Function App
# `bakk-rekrutacja-api` przez OIDC + az CLI. NIE używa Azure/functions-action
# bo ten wymaga SCM/Kudu endpoint, który jest blokowany przez Easy Auth
# (`Return401` na całym hoście). az CLI `functionapp deployment source
# config-zip` idzie przez management API i działa z Easy Auth on.
#
# Auth: User-Assigned Managed Identity `id-bakk-rekrutacja-deploy` w
# `rg-bakk-docs` z rolą Website Contributor scope=Function App, federated
# credential dla repo:oskar-bialek-bakk/bakk-rekrutacja:ref:refs/heads/main.

on:
  push:
    branches: [main]
    paths:
      - 'etap2/api/**'
      - '.github/workflows/deploy-bakk-rekrutacja-api.yml'
  workflow_dispatch:

permissions:
  id-token: write   # wymagane przez azure/login@v2 OIDC
  contents: read

env:
  FUNCTION_APP_NAME: bakk-rekrutacja-api
  RESOURCE_GROUP: rg-bakk-docs
  NODE_VERSION: '24.x'
  WORKING_DIR: etap2/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install + build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prune dev dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm prune --omit=dev

      - name: Package zip
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          zip -r ../api-deploy.zip host.json package.json package-lock.json dist node_modules
          ls -la ../api-deploy.zip

      - name: Azure login (OIDC via UAMI id-bakk-rekrutacja-deploy)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip via az CLI
        run: |
          az functionapp deployment source config-zip \
            -g "${{ env.RESOURCE_GROUP }}" \
            -n "${{ env.FUNCTION_APP_NAME }}" \
            --src etap2/api-deploy.zip \
            --build-remote false \
            --timeout 300

      - name: Smoke test - health endpoint should require auth (401)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://${FUNCTION_APP_NAME}.azurewebsites.net/api/health)
          echo "GET /api/health without token returned HTTP $status"
          if [ "$status" != "401" ]; then
            echo "::warning::Expected 401 from Easy Auth, got $status. Sprawdz konfiguracje Easy Auth."
          fi
