<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ocena rozmowy — II etap · BAKK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand" role="button" tabindex="0" title="Przejdź do porównania kandydatów">
    <div class="mark">BAKK<span>·</span>rec</div>
    <div class="sub">II etap — ocena</div>
  </div>
  <nav class="topnav"><button class="topnav-btn" id="nav-roster" type="button">Porównanie kandydatów</button></nav>
  <div class="clock" id="clock" style="visibility:hidden">
    <div class="timer" id="timer">
      <span class="dot"></span><b id="elapsed">00:00</b>
      <span class="timer-controls">
        <button type="button" id="btn-nudge-minus" title="-1 min" aria-label="Odejmij minute od zegara">&minus;1m</button>
        <button type="button" id="btn-pause" aria-pressed="false" title="Pauza odliczania" aria-label="Pauza lub wznow zegar">&#9208;</button>
        <button type="button" id="btn-nudge-plus" title="+1 min" aria-label="Dodaj minute do zegara">+1m</button>
      </span>
    </div>
    <div class="total">/ 60:00 · oceniana 40:00</div>
  </div>
</div>
<div class="wrap"><div id="app"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
